<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Smitten Player</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❤</text></svg>">
<link rel="stylesheet" href="player.css">
</head>
<body>
<div id="stage">
  <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
</div>

<div id="overlay" hidden>
  <div class="poster" aria-hidden="true"></div>
  <div class="card">
    <h1 id="overlay-title">Smitten</h1>
    <p id="overlay-by" hidden></p>
    <button id="play-button" class="play" type="button" aria-label="Play" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 5.8v12.4c0 .8.9 1.3 1.6.9l9.8-6.2c.6-.4.6-1.4 0-1.8l-9.8-6.2c-.7-.4-1.6.1-1.6.9z"/></svg>
    </button>
    <div class="loading">
      <div class="bar"><div id="overlay-progress"></div></div>
      <div id="overlay-status">Loading…</div>
    </div>
    <label id="file-picker" hidden>
      Drop a game here, or <u>choose a file</u>
      <input type="file" accept=".zip,.love" hidden>
    </label>
  </div>
  <a class="made-with" href="https://smitten.mostlime.hackclub.app/" target="_blank" rel="noopener"><span aria-hidden="true">♥</span> Made with Smitten</a>
</div>

<div id="dialog-bar" role="dialog" aria-labelledby="dialog-title" hidden>
  <span id="dialog-title"></span>
  <button id="dialog-ok"></button>
  <button id="dialog-cancel"></button>
</div>

<div id="toolbar" hidden>
  <button id="btn-fullscreen" title="Fullscreen (F11)" aria-label="Fullscreen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V5a1 1 0 0 1 1-1h4M15 4h4a1 1 0 0 1 1 1v4M20 15v4a1 1 0 0 1-1 1h-4M9 20H5a1 1 0 0 1-1-1v-4"/></svg></button>
</div>

<script type="module" src="player.js"></script>
</body>
</html>
