<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Smitten Player</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❤</text></svg>">
<link rel="stylesheet" href="player.css">
<!-- The engine's JavaScript downloads while player.js does. smitten.wasm
     isn't preloaded here: Chromium doesn't keep compiled code for a
     preloaded response, so player.js fetches it as soon as it runs. -->
<link rel="modulepreload" href="smitten.mjs?v=__SMITTEN_BUILD__">
</head>
<body>
<div id="stage">
  <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
</div>

<!-- The splash screen while the game loads (customizable in smitten.json
     "splash"), and messages when something goes wrong or the game ends. -->
<div id="overlay" hidden>
  <div class="splash">
    <img id="splash-image" alt="" hidden>
    <svg id="splash-mark" class="mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.2 3 4.5 6.6 4.5c2.1 0 3.6 1.1 4.4 2.6.8-1.5 2.3-2.6 4.4-2.6 3.6 0 5.7 3.7 4.2 7.2C19.5 16.4 12 21 12 21z"/></svg>
    <p id="splash-caption">Made with Smitten</p>
  </div>
  <div class="foot">
    <div class="bar"><div id="overlay-progress"></div></div>
    <div id="overlay-status" role="status"></div>
    <button id="play-button" class="play" type="button" aria-label="Play again" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4.5h4.5"/></svg>
    </button>
    <label id="file-picker" hidden>
      Drop a game here, or <u>choose a file</u>
      <input type="file" accept=".zip" hidden>
    </label>
  </div>
</div>

<div id="dialog-bar" role="dialog" aria-labelledby="dialog-title" hidden>
  <span id="dialog-title"></span>
  <button id="dialog-ok"></button>
  <button id="dialog-cancel"></button>
</div>

<!-- Clips (clips.js): Record keeps the last seconds; Save clip downloads
     them as a video or a GIF. Both show only where the browser can record. -->
<div id="toolbar" hidden>
  <button id="btn-record" title="Record: keep the last 10 seconds, to save as a clip" aria-label="Record" aria-pressed="false" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle class="dot" cx="12" cy="12" r="3.5"/></svg></button>
  <button id="btn-clip" title="Save a clip of the last 10 seconds (F9)" aria-label="Save a clip" aria-haspopup="menu" aria-expanded="false" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5"/></svg></button>
  <button id="btn-fullscreen" title="Fullscreen (F11)" aria-label="Fullscreen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V5a1 1 0 0 1 1-1h4M15 4h4a1 1 0 0 1 1 1v4M20 15v4a1 1 0 0 1-1 1h-4M9 20H5a1 1 0 0 1-1-1v-4"/></svg></button>
  <span id="rec-dot" aria-hidden="true"></span>
</div>
<div id="clip-menu" role="menu" hidden>
  <button role="menuitem" data-format="webm">Video (WebM, with sound) <kbd>F9</kbd></button>
  <button role="menuitem" data-format="gif">GIF <kbd>Shift+F9</kbd></button>
</div>
<div id="clip-status" role="status" hidden></div>

<script type="module" src="player.js"></script>
</body>
</html>
