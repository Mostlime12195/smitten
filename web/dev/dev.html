<!doctype html>
<html><head><meta charset="utf-8"><title>Smitten dev harness</title>
<style>body{background:#222;color:#ddd;font:12px monospace;margin:0}canvas{display:block}</style></head>
<body><canvas id="canvas" tabindex="1"></canvas><pre id="log"></pre>
<script type="module">
// Development harness: runs the Lua source in the URL hash (base64url) as the
// script of the main scene's root piece.
import createSmitten from './smitten.mjs';
window.addEventListener('hashchange', () => location.reload());
const log = (...a) => { document.getElementById('log').textContent += a.join(' ') + '\n'; console.log(...a); };
const b64 = location.hash.slice(1).replace(/-/g, '+').replace(/_/g, '/');
const script = new TextDecoder().decode(Uint8Array.from(atob(b64), (c) => c.charCodeAt(0)));
const Module = await createSmitten({ canvas: document.getElementById('canvas'), print: log, printErr: log,
  onLoveQuit: (code) => log('quit', code) });
Module.FS.mkdir('/game');
Module.FS.writeFile('/game/smitten.json', JSON.stringify({ format: 'smitten.project', version: 2, name: 'dev', main: 'main.scene' }));
Module.FS.writeFile('/game/main.scene', JSON.stringify({ format: 'smitten.scene', version: 2, root: { name: 'Main', type: 'Group', script: 'main.lua' } }));
Module.FS.writeFile('/game/main.lua', script);
window.frameTimes = [];
let last = performance.now();
(function tick() { const n = performance.now(); frameTimes.push(n - last); last = n; requestAnimationFrame(tick); })();
Module.callMain(['/game']);
</script></body></html>
