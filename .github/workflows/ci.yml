# Runs the tests and builds the engine on every push and pull request. The
# built site (editor, player, engine) is kept as the "dist" artifact.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  EMSDK_VERSION: 6.0.13

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Editor tests
        run: node tools/editor-tests/test.mjs

      - name: Tile format tests
        run: node web/editor/workspaces/scene/cells.test.mjs

      - name: Terrain tests
        run: node web/editor/workspaces/scene/terrain.test.mjs

      - name: UI layout tests
        run: node web/editor/workspaces/scene/uilayout.test.mjs

      - name: Keyframe tests
        run: node web/editor/workspaces/scene/keyframes.test.mjs

      - name: Sprite editor tests
        run: node web/editor/tools/sprite/draw.test.mjs

      - name: Sound file tests
        run: node web/editor/tools/wav/wav.test.mjs

      # Clips: the GIF encoder, WebM joining and cutting, the ring of recordings.
      - name: Clip tests
        run: node tools/clip-tests/test.mjs

      - name: Sharing site tests
        run: node tools/platform-tests/test.mjs

      - name: Server tests
        run: python3 tools/serve_test.py

      # The pathfinders are plain Lua 5.1, tested without the engine.
      - name: Pathfinding tests
        run: |
          sudo apt-get install -y -q lua5.1
          lua5.1 tools/paths-tests/test.lua

      # So are the text engine's parser and layout, with a made-up font.
      - name: Text tests
        run: lua5.1 tools/text-tests/test.lua

      # And the UI pieces' logic: layout, sliders, checkboxes, typing, focus.
      - name: UI tests
        run: lua5.1 tools/ui-tests/test.lua

      # And seeds, generators and noise around love.math's (stand-ins here).
      - name: Random tests
        run: lua5.1 tools/random-tests/test.lua

      # And animations: keyframes and the Animator piece.
      - name: Animation tests
        run: lua5.1 tools/animation-tests/test.lua

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Includes Emscripten's ports cache (SDL3, FreeType, HarfBuzz, ...).
      - uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}-${{ runner.os }}

      - name: Install Emscripten
        run: |
          [ -d ~/emsdk ] || git clone --depth 1 https://github.com/emscripten-core/emsdk.git ~/emsdk
          ~/emsdk/emsdk install $EMSDK_VERSION
          ~/emsdk/emsdk activate $EMSDK_VERSION

      - name: Build
        run: |
          source ~/emsdk/emsdk_env.sh
          python3 build.py

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # The scene tests run the built engine in the runner's Chrome, which has
      # no GPU: WebGL comes from SwiftShader.
      - name: Scene tests
        run: node tools/scene-tests/run.mjs
        env:
          CHROME_FLAGS: --no-sandbox --enable-unsafe-swiftshader

      # The sound file editor in the built editor, with Chrome's fake
      # microphone: record, trim, save, and a song with the recording.
      - name: Recorder test
        run: node tools/editor-tests/record.mjs
        env:
          CHROME_FLAGS: --no-sandbox --enable-unsafe-swiftshader

      # The sprite editor in the built editor: finding it, and strokes while
      # it saves by itself.
      - name: Sprite editor test
        run: node tools/editor-tests/paint.mjs
        env:
          CHROME_FLAGS: --no-sandbox --enable-unsafe-swiftshader

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dist
          path: dist
          retention-days: 30
